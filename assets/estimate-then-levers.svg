<svg viewBox="0 0 1200 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Estimate, then pick three levers</title>
<desc id="desc">Four steps: you give your token counts, your AI agent estimates a range for energy, carbon and water, you pick three levers, and you check the trend each month. The levers are: right-size the model, cache and summarize, limit loops and retries, and batch and time-shift work.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" fill="#2d3142"/>
  </marker>
  <marker id="arrowMuted" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" fill="#7a8399"/>
  </marker>
  <marker id="arrowAccent" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" fill="#eb6c36"/>
  </marker>
</defs>
<rect x="0" y="0" width="1200" height="450" fill="#f5f5f5"/>
<text x="40" y="44" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="28" fill="#2d3142">Estimate, then pick three levers</text>
<text x="40" y="64" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="9" letter-spacing="0.06em" fill="#7a8399">A RANGE, NOT A PRECISE NUMBER</text>
<rect x="40" y="100" width="250" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="46" y="106" width="30" height="16" rx="4" fill="#ececec"/>
<text x="61.0" y="118" text-anchor="middle" font-family="Geist, sans-serif" font-size="8" font-weight="600" fill="#2d3142">YOU</text>
<text x="165.0" y="135.4" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Your token counts</text>
<text x="165.0" y="148.4" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">turns, prompt, retries</text>
<line x1="290" y1="138" x2="326" y2="138" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="330" y="100" width="250" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="336" y="106" width="24" height="16" rx="4" fill="#ececec"/>
<text x="348.0" y="118" text-anchor="middle" font-family="Geist, sans-serif" font-size="8" font-weight="600" fill="#2d3142">AI</text>
<text x="455.0" y="135.4" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Estimate a range</text>
<text x="455.0" y="148.4" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">energy, carbon, water</text>
<line x1="580" y1="138" x2="616" y2="138" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="620" y="100" width="250" height="76" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
<rect x="626" y="106" width="30" height="16" rx="4" fill="#ececec"/>
<text x="641.0" y="118" text-anchor="middle" font-family="Geist, sans-serif" font-size="8" font-weight="600" fill="#2d3142">YOU</text>
<text x="745.0" y="135.4" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Pick three levers</text>
<text x="745.0" y="148.4" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">biggest saving first</text>
<line x1="870" y1="138" x2="906" y2="138" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="910" y="100" width="250" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="916" y="106" width="30" height="16" rx="4" fill="#ececec"/>
<text x="931.0" y="118" text-anchor="middle" font-family="Geist, sans-serif" font-size="8" font-weight="600" fill="#2d3142">YOU</text>
<text x="1035.0" y="135.4" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Check the trend</text>
<text x="1035.0" y="148.4" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">each month</text>
<line x1="745" y1="176" x2="745" y2="232" stroke="#7a8399" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowMuted)"/>
<text x="757" y="208" text-anchor="start" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" letter-spacing="0.06em" fill="#4f5d75">choose from these</text>
<text x="40" y="222" text-anchor="start" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" letter-spacing="0.06em" fill="#4f5d75">THE LEVERS</text>
<rect x="40" y="236" width="250" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="46" y="242" width="40" height="16" rx="4" fill="#ececec"/>
<text x="66.0" y="254" text-anchor="middle" font-family="Geist, sans-serif" font-size="8" font-weight="600" fill="#2d3142">LEVER</text>
<text x="165.0" y="271.4" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Right-size the model</text>
<text x="165.0" y="284.4" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">small model for easy steps</text>
<rect x="330" y="236" width="250" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="336" y="242" width="40" height="16" rx="4" fill="#ececec"/>
<text x="356.0" y="254" text-anchor="middle" font-family="Geist, sans-serif" font-size="8" font-weight="600" fill="#2d3142">LEVER</text>
<text x="455.0" y="271.4" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Cache and summarize</text>
<text x="455.0" y="284.4" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">do not re-read old turns</text>
<rect x="620" y="236" width="250" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="626" y="242" width="40" height="16" rx="4" fill="#ececec"/>
<text x="646.0" y="254" text-anchor="middle" font-family="Geist, sans-serif" font-size="8" font-weight="600" fill="#2d3142">LEVER</text>
<text x="745.0" y="271.4" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Limit loops and retries</text>
<text x="745.0" y="284.4" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">stop runaway turns</text>
<rect x="910" y="236" width="250" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="916" y="242" width="40" height="16" rx="4" fill="#ececec"/>
<text x="936.0" y="254" text-anchor="middle" font-family="Geist, sans-serif" font-size="8" font-weight="600" fill="#2d3142">LEVER</text>
<text x="1035.0" y="271.4" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Batch and time-shift</text>
<text x="1035.0" y="284.4" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">run when the grid is cleaner</text>
<text x="600" y="346" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" letter-spacing="0.06em" fill="#4f5d75">THE TREND MATTERS MORE THAN THE EXACT NUMBER.</text>
<line x1="40" y1="368" x2="1160" y2="368" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
<text x="40" y="394" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" font-weight="600" letter-spacing="0.1em" fill="#7a8399">WHO</text>
<rect x="120" y="384" width="30" height="16" rx="4" fill="#ececec"/>
<text x="135.0" y="396" text-anchor="middle" font-family="Geist, sans-serif" font-size="8" font-weight="600" fill="#2d3142">YOU</text>
<text x="160" y="396" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#2d3142">you do this step</text>
<rect x="466.6666666666667" y="384" width="24" height="16" rx="4" fill="#ececec"/>
<text x="478.6666666666667" y="396" text-anchor="middle" font-family="Geist, sans-serif" font-size="8" font-weight="600" fill="#2d3142">AI</text>
<text x="500.6666666666667" y="396" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#2d3142">your AI agent does this step</text>
<rect x="813.3333333333334" y="384" width="30" height="16" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
<text x="853.3333333333334" y="396" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#2d3142">where you decide</text>
</svg>
