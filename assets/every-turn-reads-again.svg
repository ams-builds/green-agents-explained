<svg viewBox="0 0 1200 490" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Every turn reads everything again</title>
<desc id="desc">Four turns of an agent loop drawn as bars. Each turn sends the standing prompt, the request, and all earlier turns to the model again, so each bar is longer than the one before it.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" fill="#2d3142"/>
  </marker>
  <marker id="arrowMuted" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" fill="#7a8399"/>
  </marker>
  <marker id="arrowAccent" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" fill="#eb6c36"/>
  </marker>
</defs>
<rect x="0" y="0" width="1200" height="490" fill="#f5f5f5"/>
<text x="40" y="44" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="28" fill="#2d3142">Every turn reads everything again</text>
<text x="40" y="64" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="9" letter-spacing="0.06em" fill="#7a8399">WHY AGENT COSTS GROW FASTER THAN YOU EXPECT</text>
<rect x="40" y="96" width="280" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="46" y="102" width="43" height="16" rx="4" fill="#ececec"/>
<text x="67.5" y="114" text-anchor="middle" font-family="Geist, sans-serif" font-size="8" font-weight="600" fill="#2d3142">TURN 1</text>
<text x="180.0" y="129.4" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Prompt + request</text>
<text x="180.0" y="142.4" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">read once</text>
<rect x="40" y="182" width="560" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="46" y="188" width="43" height="16" rx="4" fill="#ececec"/>
<text x="67.5" y="200" text-anchor="middle" font-family="Geist, sans-serif" font-size="8" font-weight="600" fill="#2d3142">TURN 2</text>
<text x="320.0" y="215.4" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Prompt + request + turn 1</text>
<text x="320.0" y="228.4" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">read again</text>
<rect x="40" y="268" width="840" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="46" y="274" width="43" height="16" rx="4" fill="#ececec"/>
<text x="67.5" y="286" text-anchor="middle" font-family="Geist, sans-serif" font-size="8" font-weight="600" fill="#2d3142">TURN 3</text>
<text x="460.0" y="301.4" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Prompt + request + turns 1 to 2</text>
<text x="460.0" y="314.4" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">read again</text>
<rect x="40" y="354" width="1120" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
<rect x="46" y="360" width="43" height="16" rx="4" fill="#ececec"/>
<text x="67.5" y="372" text-anchor="middle" font-family="Geist, sans-serif" font-size="8" font-weight="600" fill="#2d3142">TURN 4</text>
<text x="600.0" y="387.4" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Prompt + request + turns 1 to 3</text>
<text x="600.0" y="400.4" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">read again</text>
<text x="600" y="462" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" letter-spacing="0.06em" fill="#4f5d75">EVERY TURN READS THE WHOLE CONVERSATION AGAIN.</text>
</svg>
